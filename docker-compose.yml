services:
  aibot:
    image: ghcr.io/dann2333/aichatbot:latest
    build: .
    container_name: aibot
    restart: unless-stopped
    volumes:
      - ./data:/data          # 把 config.yaml 放在 ./data 下
    environment:
      - TZ=Asia/Shanghai
    # bubblewrap 需要在容器内创建命名空间并挂载 /proc
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
